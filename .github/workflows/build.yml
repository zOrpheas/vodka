name: Build

# Push a tag like v0.2.0 to publish a release with installers for every platform.
# Pushes to main and pull requests build the same installers as downloadable workflow artifacts.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Vodka $TAG" -F draft=true -F generate_release_notes=true \
            -f body="$(cat .github/release-notes.md)" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    # Runs for tags (after the draft exists) and for branch / PR builds (release job skipped).
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04 # oldest supported glibc, so packages run on older distros too
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static # no Visual C++ runtime needed on the user's PC
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf file libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - run: npm ci

      - name: Fetch yt-dlp and ffmpeg, build whisper.cpp
        shell: bash
        run: sh scripts/fetch-sidecars.sh

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --target ${{ matrix.target }}
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/') }}
          retryAttempts: 1

  publish:
    name: Publish release
    needs: [release, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }}" -F draft=false
