[package]
name = "vodka"
version = "0.1.0"
description = "A desktop music player you fill yourself: paste YouTube, SoundCloud or Spotify links, get a local library."
edition = "2021"

[lib]
name = "vodka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Smaller, faster release binary (build takes a bit longer).
[profile.release]
lto = true
codegen-units = 1
strip = true
